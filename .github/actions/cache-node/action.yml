name: Cache the exact WasalX Node distribution
description: Prepare verified job-owned Linux x64 Node and publish its exact binary to PATH.
inputs:
  node-version:
    description: Exact Node.js version used by the calling workflow
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        TOOL_SOURCE: ${{ github.action_path }}
      run: bash "$TOOL_SOURCE/cache-node.sh"
    - name: Verify the prepared Node command
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        job_root="$(cd "$RUNNER_TEMP" && pwd -P)"
        expected="${WASALX_NODE_BIN:?verified Node path missing}"
        [[ "$expected" == "$job_root/wasalx-node-$NODE_VERSION/x64/bin/node" ]]
        node_path="$(command -v node)"
        [[ -f "$node_path" && -x "$node_path" && -f "$expected" && -x "$expected" ]]
        resolved="$(realpath "$node_path")"
        printf 'Node command: %s\nNode realpath: %s\nVerified Node binary: %s\n' "$node_path" "$resolved" "$expected"
        [[ "$resolved" == "$expected" ]]
        node_version="$("$expected" --version)"
        [[ "$node_version" == "v$NODE_VERSION" ]]
