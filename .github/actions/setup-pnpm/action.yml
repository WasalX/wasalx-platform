name: Set up the exact WasalX pnpm tool
description: Install only the integrity-locked project version in a job-local directory.
inputs:
  phase-guard:
    description: Check the build host schedule v2 before the locked npm installation
    default: 'false'
  node-version:
    description: Exact Node.js version used by the calling workflow
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cache-node
      with:
        node-version: ${{ inputs.node-version }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      if: runner.os != 'Linux' || runner.arch != 'X64'
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install and verify the locked pnpm tool
      shell: bash
      env:
        TOOL_SOURCE: ${{ github.action_path }}
        WASALX_CI_PHASE_GUARD: ${{ inputs.phase-guard }}
      run: |
        set -euo pipefail
        expected="$(node -p 'require(process.env.TOOL_SOURCE + "/package.json").dependencies.pnpm')"
        [[ "$(node -p 'require("./package.json").packageManager')" == "pnpm@$expected" ]]
        tool_dir="$(mktemp -d "$RUNNER_TEMP/wasalx-pnpm.XXXXXX")"
        cp "$TOOL_SOURCE/package.json" "$TOOL_SOURCE/package-lock.json" "$tool_dir/"
        if [[ "${WASALX_CI_PHASE_GUARD:-false}" == true ]]; then
          python3 scripts/release/ci-phase-guard.py
        fi
        npm ci --prefix "$tool_dir" --ignore-scripts --no-audit --no-fund
        [[ "$(node "$tool_dir/node_modules/pnpm/bin/pnpm.mjs" --version)" == "$expected" ]]
        printf '%s/node_modules/.bin\n' "$tool_dir" >> "$GITHUB_PATH"
        printf 'PNPM_HOME=%s/node_modules/.bin\n' "$tool_dir" >> "$GITHUB_ENV"
