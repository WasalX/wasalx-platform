name: Set up pinned Cosign
description: Install Cosign and verify the Linux amd64 binary against the repository pin.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        version=$(jq -er '.version' scripts/release/cosign-pin.json)
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: ${{ steps.pin.outputs.version }}
    - shell: bash
      run: |
        sha=$(jq -er '.linuxAmd64Sha256' scripts/release/cosign-pin.json)
        binary=$(command -v cosign)
        printf '%s  %s\n' "$sha" "$binary" | sha256sum --check --strict
