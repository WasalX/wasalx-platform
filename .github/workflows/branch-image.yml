name: release

on:
  workflow_call:
    outputs:
      complete:
        value: ${{ jobs.manifest.outputs.complete }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WasalX/wasalx-platform'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    environment:
      name: stg
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        image:
          - portal
          - control-api
          - connector-worker
          - secret-sidecar
          - invitation-mailer
          - identity-policy-activator
          - tenant-provisioner
          - tenant-workspace-controller
          - workspace-provider
          - workspace-configurator
          - foundation-postgres
          - foundation-keycloak
          - production-ingress
          - production-cloudflared
          - production-prometheus
          - production-alertmanager
          - production-otel
          - zammad-nginx
          - zammad-redis
          - zammad-memcached
          - zammad
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Require GitHub-hosted execution
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: test "$HOSTED_KIND" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve catalog entry and add-on pin
        id: image
        run: |
          matrix=$(python3 scripts/release/images-by-digest.py matrix)
          row=$(jq -ce --arg image "$IMAGE" '.include[] | select(.image == $image)' <<< "$matrix")
          pending=$(jq -er '.pending | tostring' <<< "$row")
          addon_source=$(jq -c '.addonSource' <<< "$row")
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_ADDON_SOURCE=$addon_source" >> "$GITHUB_ENV"
      - if: steps.image.outputs.pending == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - if: steps.image.outputs.pending == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.30.1
          driver-opts: image=moby/buildkit:v0.26.3
          cache-binary: false
      - if: steps.image.outputs.pending == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build without cache imports, export layers and inspect
        if: steps.image.outputs.pending == 'false'
        run: python3 scripts/release/images-by-digest.py build --cache write --image "$IMAGE" --output "records/$IMAGE.json"
      - if: steps.image.outputs.pending == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify the pinned cosign binary
        if: steps.image.outputs.pending == 'false'
        run: echo 'c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74  '"$(command -v cosign)" | sha256sum --check --strict
      - name: Publish, sign, attest and inspect the published digest
        id: digest
        if: steps.image.outputs.pending == 'false'
        run: |
          python3 scripts/release/images-by-digest.py publish --output "records/$IMAGE.json"
          digest=$(jq -er '.digest' "records/$IMAGE.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.pending == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/wasalx/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record pending add-on source
        if: steps.image.outputs.pending == 'true'
        run: python3 scripts/release/images-by-digest.py pending --image "$IMAGE" --output "records/$IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-published-${{ matrix.image }}
          path: records/${{ matrix.image }}.json
          if-no-files-found: error
          overwrite: true

  manifest:
    name: Image digest manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WasalX/wasalx-platform'
    needs: publish
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require GitHub-hosted execution
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: test "$HOSTED_KIND" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-published-*
          path: records
          merge-multiple: true
      - name: Require complete published/pending receipts from one source tree
        run: python3 scripts/release/images-by-digest.py assemble --records records --output images-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: images-manifest
          path: images-manifest.json
          if-no-files-found: error
          overwrite: true
      - id: complete
        run: echo "complete=true" >> "$GITHUB_OUTPUT"
