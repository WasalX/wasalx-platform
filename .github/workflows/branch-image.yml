name: release

on:
  workflow_call:
    outputs:
      complete:
        value: ${{ jobs.manifest.outputs.complete }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WasalX/wasalx-platform'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        image:
          - portal
          - control-api
          - connector-worker
          - secret-sidecar
          - invitation-mailer
          - identity-policy-activator
          - tenant-provisioner
          - tenant-workspace-controller
          - workspace-provider
          - workspace-configurator
          - foundation-postgres
          - foundation-keycloak
          - production-ingress
          - production-cloudflared
          - production-prometheus
          - production-alertmanager
          - production-otel
          - zammad-nginx
          - zammad-redis
          - zammad-memcached
          - zammad
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Require GitHub-hosted execution
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: test "$HOSTED_KIND" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve catalog entry and add-on pin
        id: image
        run: |
          matrix=$(python3 scripts/release/images-by-digest.py matrix)
          row=$(jq -ce --arg image "$IMAGE" '.include[] | select(.image == $image)' <<< "$matrix")
          pending=$(jq -er '.pending | tostring' <<< "$row")
          addon_source=$(jq -c '.addonSource' <<< "$row")
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_ADDON_SOURCE=$addon_source" >> "$GITHUB_ENV"
      - if: steps.image.outputs.pending == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - if: steps.image.outputs.pending == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          driver-opts: image=moby/buildkit:v0.26.3
          cache-binary: false
      - if: steps.image.outputs.pending == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build without cache imports, export layers and inspect
        if: steps.image.outputs.pending == 'false'
        env:
          BUILD_CACHE: ${{ github.ref_name == 'main' && 'write' || 'off' }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.image == 'portal' && vars.PUBLIC_CONTACT_EMAIL || '' }}
        run: python3 scripts/release/images-by-digest.py build --cache "$BUILD_CACHE" --image "$IMAGE" --output "records/$IMAGE.json"
      - if: steps.image.outputs.pending == 'false'
        uses: ./.github/actions/cosign
      - name: Publish, sign, attest and inspect the published digest
        if: steps.image.outputs.pending == 'false'
        run: python3 scripts/release/images-by-digest.py publish --output "records/$IMAGE.json"
      - name: Record pending add-on source
        if: steps.image.outputs.pending == 'true'
        run: python3 scripts/release/images-by-digest.py pending --image "$IMAGE" --output "records/$IMAGE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-published-${{ matrix.image }}
          path: records/${{ matrix.image }}.json
          if-no-files-found: error
          overwrite: true

  manifest:
    name: Image digest manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WasalX/wasalx-platform'
    needs: publish
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require GitHub-hosted execution
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: test "$HOSTED_KIND" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-published-*
          path: records
          merge-multiple: true
      - name: Require complete published/pending receipts from one source tree
        run: python3 scripts/release/images-by-digest.py assemble --records records --output images-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-manifest
          path: images-manifest.json
          if-no-files-found: error
          overwrite: true
      - id: complete
        run: |
          complete=$(jq -er --arg commit "$GITHUB_SHA" 'select(.commit == $commit) | .publicationComplete | booleans | tostring' images-manifest.json)
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          printf 'Immutable image publication complete for `%s`: %s\n' "$GITHUB_SHA" "$complete" >> "$GITHUB_STEP_SUMMARY"
