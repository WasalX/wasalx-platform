name: Compose replay phase diagnostic

on: workflow_dispatch

permissions:
  contents: read

jobs:
  replay:
    name: Cold Compose replay (${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: failed-tree
            head: f422452a6de8c97bd81f01d6d40dff6777fd7c66
            tree: 1ec309bf5afd40485651fd97a71a4660bdb8ea7b
          - sample: parent-tree
            head: 529bbee9999dd14c63a8efa89b48f188fc047c6d
            tree: 99b148f2870a7d160cba2a2e10e251bc8c3eda05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Run original preflight and observe process phases
        env:
          EXPECTED_HEAD: ${{ matrix.head }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -eu
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$head" = "$EXPECTED_HEAD"
          test "$tree" = "$EXPECTED_TREE"
          printf 'workflow_head=%s replay_head=%s replay_tree=%s\n' "$GITHUB_SHA" "$head" "$tree"

          python3 -I -B - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          from tempfile import TemporaryFile
          import time

          def phases(root):
              pending = [root]
              seen = set()
              active = set()
              while pending:
                  pid = pending.pop()
                  if pid in seen:
                      continue
                  seen.add(pid)
                  proc = Path("/proc") / str(pid)
                  try:
                      exe = Path(os.readlink(proc / "exe")).name
                      if exe in ("docker", "docker-compose"):
                          args = (proc / "cmdline").read_bytes().split(b"\0")[1:]
                          if exe == "docker" and b"compose" in args and b"config" in args:
                              active.add("docker_cli")
                          elif exe == "docker-compose":
                              if b"docker-cli-plugin-metadata" in args:
                                  active.add("plugin_metadata")
                              elif b"config" in args:
                                  active.add("plugin_config")
                  except (FileNotFoundError, ProcessLookupError, PermissionError):
                      pass
                  # A Go process may start a child from any of its OS threads.
                  for children in (proc / "task").glob("*/children"):
                      try:
                          pending.extend(map(int, children.read_text().split()))
                      except (FileNotFoundError, ProcessLookupError, PermissionError):
                          pass
              return active

          with TemporaryFile() as tap_file:
              started = time.monotonic()
              replay = subprocess.Popen(
                  ["node", "--test", "tests/installer-dev-recreatability.test.mjs"],
                  stdout=tap_file, stderr=subprocess.STDOUT,
              )
              first = {}
              last = {}
              previous = started
              max_gap = 0
              observer_cpu = time.process_time()
              while replay.poll() is None:
                  now = time.monotonic()
                  if now - started >= 20:
                      break
                  max_gap = max(max_gap, now - previous)
                  previous = now
                  elapsed = (now - started) * 1000
                  for phase in phases(replay.pid):
                      first.setdefault(phase, elapsed)
                      last[phase] = elapsed
                  time.sleep(0.01)
              print(f"sample_max_gap_ms={max_gap * 1000:.1f} observer_cpu_ms={(time.process_time() - observer_cpu) * 1000:.1f}")
              for phase in ("docker_cli", "plugin_metadata", "plugin_config"):
                  if phase in first:
                      print(f"{phase}_first_ms={first[phase]:.1f} {phase}_last_ms={last[phase]:.1f}")
                  else:
                      print(f"{phase}=unobserved")
              if "plugin_config" in first:
                  print(f"plugin_config_observed_span_ms={last['plugin_config'] - first['plugin_config']:.1f}")
              if "docker_cli" in first and "plugin_config" in first:
                  print(f"cli_to_plugin_first_seen_ms={first['plugin_config'] - first['docker_cli']:.1f}")
              status = replay.wait()
              tap_file.seek(0)
              tap = tap_file.read()

          timing = re.search(rb"(?m)^\s*# Candidate Compose render took ([0-9.]+) ms\s*$", tap)
          if timing:
              print(f"native_call_elapsed_ms={timing[1].decode('ascii')}")
          timeout = b"spawnSync docker ETIMEDOUT" in tap
          passed = status == 0 and b"ok 1 - DEV preimage replay:" in tap and bool(re.search(rb"(?m)^# pass 1$", tap))
          result = "pass" if passed else "docker_timeout" if timeout else "failure"
          print(f"replay={result} replay_exit={status}")

          # Read the version only after the observed first replay.
          version = "unavailable"
          try:
              query = subprocess.run(
                  ["docker", "compose", "version", "--short"], capture_output=True, timeout=3,
                  env={**os.environ, "DOCKER_CONTEXT": "", "DOCKER_HOST": "tcp://127.0.0.1:0",
                       "DOCKER_TLS": "", "DOCKER_TLS_VERIFY": ""},
              )
              observed = query.stdout.strip()
              if query.returncode == 0 and re.fullmatch(rb"v?\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)*", observed):
                  version = observed.decode("ascii")
          except (OSError, subprocess.TimeoutExpired):
              pass
          print(f"compose_version={version}")
          raise SystemExit(0 if passed else 1)
          PY
