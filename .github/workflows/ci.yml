name: Hosted UI proof 433
run-name: Hosted UI proof 433

on: workflow_dispatch

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: 'b17afd0b575e1e9ee4c243e8774e249e30077f25'
      CANDIDATE_TREE: '1d1612de17873e60957b7140e7fa710ebb9d43c9'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate identity
        id: identity
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          test "$RUNNER_KIND" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = $'.github/qa/meta-cost-axe.mjs\n.github/qa/meta-cost-handoff.mjs\n.github/qa/meta-cost-reporter.mjs\n.github/workflows/ci.yml'
          test -z "$(git status --porcelain)"
          printf 'Candidate %s tree %s\nProof %s tree %s\n' \
            "$CANDIDATE" "$CANDIDATE_TREE" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Set up pnpm dependencies
        id: pnpm
        uses: ./.github/actions/ci-pnpm
      - name: Build service prerequisites
        uses: ./.github/actions/ci-pnpm
        with:
          task: build
          dependency-key: ${{ steps.pnpm.outputs.dependency-key }}
          force-build: 'true'
      - name: Build the portal
        run: pnpm run build
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: pnpm exec playwright install --no-shell chromium
      - name: Run the signed-in Meta cost journey
        env:
          WASALX_E2E_CONTROL_PORT: '14101'
          WASALX_E2E_PORTAL_PORT: '14102'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/qa-ui-evidence"
          export QA_META_COST_EVIDENCE="$RUNNER_TEMP/qa-ui-evidence/cases.txt"
          result=0
          node .github/qa/meta-cost-handoff.mjs
          node --test --test-concurrency=1 tests/.qa-meta-cost-proof.mjs >/dev/null 2>&1 || result=$?
          rm -f tests/.qa-meta-cost-proof.mjs
          if [ "$result" -eq 0 ]; then
            printf 'signed-in-fixture-passed\n' >> "$QA_META_COST_EVIDENCE"
          else
            printf 'signed-in-fixture-failed\n' >> "$QA_META_COST_EVIDENCE"
          fi
          cat "$QA_META_COST_EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
          test "$result" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.identity.outcome == 'success' }}
        with:
          name: qa-ui-433-evidence
          path: ${{ runner.temp }}/qa-ui-evidence
          if-no-files-found: ignore
          retention-days: 7
