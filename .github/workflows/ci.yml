name: Compose timing
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compose-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare Compose initialization and rendering
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          project="$(jq -er .project tests/fixtures/dev-live-compose/container-facts.scrubbed.json)"
          export COMPOSE_PROFILES= PORTAL_FIXTURE_ROLE=
          files=(--env-file .env.example --file compose.yaml)
          config=(--profile full --profile runtime-workers --project-name "$project" config --no-interpolate --no-env-resolution --format json)
          measure() {
            local label="$1" status=0
            shift
            /usr/bin/time -f "$label wall=%e s user=%U s sys=%S s" timeout --kill-after=1s 10s "$@" > "$scratch/$label.json" || status="$?"
            printf '%s exit=%s bytes=%s\n' "$label" "$status" "$(wc -c < "$scratch/$label.json")"
          }
          measure full_live_engine docker compose "${files[@]}" --file compose.full.yaml "${config[@]}"
          measure full_without_engine env -u DOCKER_CONTEXT DOCKER_HOST=unix:///dev/null docker compose "${files[@]}" --file compose.full.yaml "${config[@]}"
          measure base_without_engine env -u DOCKER_CONTEXT DOCKER_HOST=unix:///dev/null docker compose "${files[@]}" "${config[@]}"
          measure plugin_version docker compose version
          if [[ -x /usr/libexec/docker/cli-plugins/docker-compose ]]; then
            measure full_direct_plugin env -u DOCKER_CONTEXT DOCKER_HOST=unix:///dev/null /usr/libexec/docker/cli-plugins/docker-compose "${files[@]}" --file compose.full.yaml "${config[@]}"
            cmp "$scratch/full_without_engine.json" "$scratch/full_direct_plugin.json"
          fi
          cmp "$scratch/full_live_engine.json" "$scratch/full_without_engine.json"
