name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      terraform: ${{ steps.terraform.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
          persist-credentials: false
      - id: terraform
        if: github.event_name == 'pull_request'
        run: |
          # Use the same test-merge base as the image matrix. Only a clean diff can skip tests.
          needed=true
          if git diff --quiet --no-ext-diff --no-renames HEAD^1 HEAD -- infra/terraform/ scripts/validate-infra.sh scripts/release/fetch-verified-asset.sh; then
            needed=false
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            args+=(--pull-request)
          elif [ "$EVENT" = merge_group ]; then
            args+=(--base-sha "$BASE_SHA")
          fi
          matrix=$(python3 scripts/release/images-by-digest.py matrix "${args[@]}")
          images=$(jq '.include | length > 0' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {name: Lint, mode: lint}
          - {name: Typecheck, mode: typecheck}
          - {name: Collection, mode: collection}
          - {name: Unit 1/2, mode: unit, shard: 1}
          - {name: Unit 2/2, mode: unit, shard: 2}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Check image publication contracts
        if: matrix.mode == 'lint'
        run: |
          python3 -B -m unittest discover -s tests -p 'test_images_by_digest.py' -v
          python3 -B tests/patch-keycloak-jackson.test.py
          node --test tests/fetch-zammad-addon.test.mjs
          ruby tests/zammad-database-entrypoint.test.rb
      - name: Check production secret adapter readiness
        if: matrix.mode == 'lint'
        run: |
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          bash scripts/validate-infra.sh --render-secret-adapter > "$manifest"
          ruby scripts/validate-secret-adapter-render.rb "$manifest"
          ruby tests/secret-adapter-readiness.test.rb "$manifest"
      - name: Check browser runner network contracts
        if: matrix.mode == 'lint'
        run: python3 -B tests/playwright-network-native.test.py
      - name: Enable pinned pnpm
        run: |
          corepack enable
          for attempt in 1 2 3; do
            if corepack install; then break; fi
            test "$attempt" != 3
            sleep "$attempt"
          done
          store=$(pnpm store path --silent)
          echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-cache
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile --fetch-retries=2
      - name: Install Ruby test prerequisites
        if: matrix.mode == 'unit' || matrix.mode == 'collection'
        run: |
          if ! ruby -rminitest -e 'puts RUBY_VERSION'; then
            sudo apt-get -o Acquire::Retries=2 update
            sudo apt-get -o Acquire::Retries=2 install -y ruby ruby-minitest
          fi
      - name: Build check prerequisites
        if: matrix.mode == 'unit' || matrix.mode == 'collection' || matrix.mode == 'typecheck'
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          pnpm run zammad:package
          pnpm run build:services
      - name: Check add-on session state
        if: matrix.mode == 'unit' && matrix.shard == 1
        run: ruby tests/fixtures/native-session-state-contract.rb
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: eslint-cache
        if: matrix.mode == 'lint'
        with:
          path: .git/hosted-eslint-cache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'pnpm-lock.yaml') }}-
      - name: Lint
        if: matrix.mode == 'lint'
        run: pnpm run lint --cache --cache-strategy content --cache-location .git/hosted-eslint-cache
      - name: Typecheck
        if: matrix.mode == 'typecheck'
        run: pnpm exec tsc --noEmit
      - name: Collect tests
        if: matrix.mode == 'collection'
        run: node scripts/hosted-ci.mjs collection
      - name: Run unit shard
        if: matrix.mode == 'unit'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/hosted-ci.mjs unit "$SHARD" 2

  lint-on-push:
    name: Lint on push
    if: github.event_name == 'push'
    # Cache warm-up only; PRs and the queue gate lint, so a failure here must not make a published trunk commit unusable.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          for attempt in 1 2 3; do
            if corepack install; then break; fi
            test "$attempt" != 3
            sleep "$attempt"
          done
          store=$(pnpm store path --silent)
          echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-cache
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile --fetch-retries=2
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: eslint-cache
        with:
          path: .git/hosted-eslint-cache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'pnpm-lock.yaml') }}-
      - name: Lint
        run: pnpm run lint --cache --cache-strategy content --cache-location .git/hosted-eslint-cache
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.eslint-cache.outputs.cache-hit != 'true'
        with:
          path: .git/hosted-eslint-cache
          key: ${{ steps.eslint-cache.outputs.cache-primary-key }}

  integration:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wasalx-ci-admin
          POSTGRES_DB: wasalx_ci
        ports: ['5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=512m
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d wasalx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          for attempt in 1 2 3; do
            if corepack install; then break; fi
            test "$attempt" != 3
            sleep "$attempt"
          done
          store=$(pnpm store path --silent)
          echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile --fetch-retries=2
      - name: Test native installer preimage capture
        run: node --experimental-strip-types --import ./tests/helpers/operator-input-fixtures.mjs --test tests/installer-preimage.test.mjs
      - name: Test PostgreSQL integration
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:wasalx-ci-admin@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/wasalx_ci
          DATABASE_APP_URL: postgresql://wasalx_runtime:wasalx-test-app@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/wasalx_ci
        run: pnpm run test:postgres
      - name: Build the portal
        run: pnpm run build
      - name: Prepare browser fixtures
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: |
          pnpm exec playwright install --no-shell chromium
          # Keep the shared fixture image available for both browser tests.
          for attempt in 1 2 3; do
            if docker pull redis:8.4.1-alpine@sha256:e55195a3afbb812a14306909caad6583a1ab6c79f393f53490e42cb2111084a9; then break; fi
            test "$attempt" != 3
            sleep "$attempt"
          done
      - name: Test portal and tenant integration
        # Keep Docker fixture network changes out of Chromium page loads.
        run: >-
          node --test --test-concurrency=1 tests/multitenant-e2e.test.mjs tests/platform-invitation-e2e.test.mjs
          tests/portal-security-headers.test.mjs tests/rendered-html.test.mjs

  terraform-test:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.terraform != 'false'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenTofu tests
        run: bash scripts/validate-infra.sh --terraform-test-only

  images:
    # Stage checks and builds within the eight-slot budget for this run.
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.changes.outputs.images == 'true' }}
    name: Build ${{ matrix.image }}${{ matrix.pending && ' (pending add-on source)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Require GitHub-hosted execution
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: test "$HOSTED_KIND" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ !matrix.pending }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - if: ${{ !matrix.pending }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          driver-opts: image=moby/buildkit:v0.26.3
          cache-binary: false
      - name: Build and inspect without publication
        if: ${{ !matrix.pending }}
        env:
          IMAGE: ${{ matrix.image }}
          PUBLIC_ADDON_SOURCE: ${{ toJSON(matrix.addonSource) }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.image == 'portal' && vars.PUBLIC_CONTACT_EMAIL || '' }}
        run: python3 scripts/release/images-by-digest.py build --cache read --image "$IMAGE" --output "records/$IMAGE.json"
      - name: Record pending add-on source
        if: matrix.pending
        env:
          IMAGE: ${{ matrix.image }}
          PUBLIC_ADDON_SOURCE: ${{ toJSON(matrix.addonSource) }}
        run: python3 scripts/release/images-by-digest.py pending --image "$IMAGE" --output "records/$IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: image-build-${{ matrix.image }}
          path: records/${{ matrix.image }}.json
          if-no-files-found: error

  publish:
    needs: lint-on-push
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'WasalX/wasalx-platform' }}
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/branch-image.yml

  ci-gate:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, dependency-review, checks, images, integration, terraform-test]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require checks and the applicable image lane
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          IMAGES_NEEDED: ${{ needs.changes.outputs.images }}
          IMAGES: ${{ needs.images.result }}
          INTEGRATION: ${{ needs.integration.result }}
          TERRAFORM_NEEDED: ${{ needs.changes.outputs.terraform }}
          TERRAFORM: ${{ needs.terraform-test.result }}
        run: |
          test "$CHANGES" = success && test "$CHECKS" = success || exit 1
          case "$EVENT:$REVIEW:$IMAGES_NEEDED:$IMAGES:$INTEGRATION" in
            pull_request:success:false:skipped:skipped|pull_request:success:true:success:skipped) ;;
            merge_group:skipped:false:skipped:success|merge_group:skipped:true:success:success) ;;
            *) exit 1 ;;
          esac
          test "$TERRAFORM" = success || {
            test "$EVENT" = pull_request && test "$TERRAFORM_NEEDED" = false && test "$TERRAFORM" = skipped
          }
