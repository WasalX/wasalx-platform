name: mirror-images

on:
  push:
    branches: [main]
    paths:
      - compose.full.yaml
      - .github/workflows/mirror-images.yml
      - scripts/release/installer-mirror-images.py
      - scripts/release/image_registry_retry.py

permissions: {}

jobs:
  mirror:
    if: github.event_name == 'push' && github.repository == 'WasalX/wasalx-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify installer object-storage mirrors
        run: python3 -B scripts/release/installer-mirror-images.py publish
