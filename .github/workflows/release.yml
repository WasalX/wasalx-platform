name: release

on:
  push:
    tags: ['v*']

permissions: {contents: read}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  stg:
    if: ${{ github.repository == 'WasalX/wasalx-platform' && contains(github.ref_name, '-rc.') }}
    environment: stg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {actions: read, contents: write, packages: write}
    steps:
      - name: Require a release candidate tag
        run: '[[ "$GITHUB_REF_NAME" == v*-rc.* ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          cache-binary: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Promote the verified digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/promote-tag.sh

  prod:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    environment: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {actions: read, contents: write, packages: write}
    steps:
      - name: Refuse release candidate tags in production
        run: |
          [[ "${GITHUB_REF_NAME,,}" != *-rc.* ]] || { echo '::error::Production refuses release candidate tags'; exit 1; }
          test "$GITHUB_REPOSITORY" = WasalX/wasalx-platform
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a successful release candidate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/release/image-manifest.sh
          commit=$(git rev-parse HEAD)
          tags=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
            -f event=push -f status=success -f head_sha="$commit" -F per_page=100 \
            --jq '.workflow_runs[].head_branch // empty') || {
            echo '::error::Could not verify successful release candidate workflow runs'
            exit 1
          }
          while IFS= read -r tag; do
            [[ "$tag" == v*-rc.* ]] || continue
            require_tag_commit "refs/tags/$tag" "$commit" >/dev/null || continue
            if published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq '.isDraft == false and .isPrerelease == true') && [[ "$published" == true ]]; then
              exit 0
            fi
          done <<< "$tags"
          echo '::error::No successful published v*-rc.* release for this commit'
          exit 1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          cache-binary: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Promote the verified digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/promote-tag.sh
