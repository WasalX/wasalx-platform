name: TypeScript comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typescript-comparison-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: TypeScript comparison (${{ matrix.tree }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: candidate
            directory: .
          - tree: main
            directory: baseline
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.tree == 'main'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.directory), format('{0}/pnpm-workspace.yaml', matrix.directory), format('{0}/package.json', matrix.directory), format('{0}/patches/**', matrix.directory)) }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install comparison tools
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix scripts/typescript-comparison --ignore-scripts --no-audit --no-fund
      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile --fetch-retries=2
          pnpm run zammad:package
      - name: Compare diagnostics, compiler time, and service emit
        id: compare
        env:
          COMPARISON_TREE: ${{ matrix.tree }}
          EXPECTED_COMPARISON_SHA: ${{ matrix.tree == 'candidate' && github.sha || github.event.pull_request.base.sha }}
        run: node "$GITHUB_WORKSPACE/scripts/compare-typescript.mjs" "$GITHUB_WORKSPACE/scripts/typescript-comparison"
      - name: Run the unit suite on TypeScript 7 output
        if: ${{ !cancelled() && steps.compare.outputs.emit == 'different' }}
        run: |
          if ! ruby -rminitest -e 'puts RUBY_VERSION'; then
            sudo apt-get -o Acquire::Retries=2 update
            sudo apt-get -o Acquire::Retries=2 install -y ruby ruby-minitest
          fi
          pnpm --dir .zammad-addon install --frozen-lockfile --fetch-retries=2
          # The package script would rebuild these files with TypeScript 5.
          node scripts/test-unit.mjs
