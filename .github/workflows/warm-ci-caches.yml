name: Warm CI caches

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    name: Seed pnpm, service build and ESLint caches
    if: github.repository == 'WasalX/wasalx-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - name: Seed pnpm caches
        id: pnpm
        uses: ./.github/actions/ci-pnpm
        with:
          seed-dependencies: 'true'
      - name: Build services
        uses: ./.github/actions/ci-pnpm
        with:
          task: build
          dependency-key: ${{ steps.pnpm.outputs.dependency-key }}
      - name: Seed the service build cache
        uses: ./.github/actions/ci-pnpm
        with:
          task: save-build
          dependency-key: ${{ steps.pnpm.outputs.dependency-key }}
      - name: Seed the ESLint cache
        uses: ./.github/actions/ci-pnpm
        with:
          task: lint

  plan:
    name: Select cacheable images from the main push
    if: github.repository == 'WasalX/wasalx-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      needed: ${{ steps.images.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the image cache exports
        id: images
        shell: bash
        env:
          BASE: ${{ github.event.before }}
        run: |
          matrix=$(python3 scripts/release/images-by-digest.py matrix --base-sha "$BASE" --cacheable-only)
          needed=$(jq -r '.include | length > 0' <<< "$matrix")
          printf 'matrix=%s\nneeded=%s\n' "$matrix" "$needed" >> "$GITHUB_OUTPUT"

  images:
    name: Seed the ${{ matrix.image }} GHCR build cache
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.30.1
          driver-opts: image=moby/buildkit:v0.26.3
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export only BuildKit cache layers
        env:
          IMAGE: ${{ matrix.image }}
          PUBLIC_ADDON_SOURCE: ${{ toJSON(matrix.addonSource) }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.image == 'portal' && vars.PUBLIC_CONTACT_EMAIL || '' }}
        run: python3 scripts/release/images-by-digest.py build --cache write --image "$IMAGE"
