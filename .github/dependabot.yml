version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /services/workspace-configurator, /.github/actions/setup-pnpm]
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # bullmq 5 accepts only ioredis 5 clients; lift together with bullmq.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      # Vinext >= 1.4.4 changes image-size bundling; needs the portal image regression updated.
      - dependency-name: "vinext"
        versions: [">=1.4.4"]
      # Keep the add-ons aligned with the locally patched Storybook release.
      - dependency-name: "@storybook/addon-a11y"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/addon-docs"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/react-vite"
        versions: [">10.6.2"]
      # The browser image and accessibility checks use these exact tool pins.
      - dependency-name: "@playwright/test"
        versions: ["1.65.1"]
      - dependency-name: "@axe-core/playwright"
        versions: ["4.14.0"]
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /infra/docker]
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ['*']
