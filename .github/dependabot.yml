version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /services/workspace-configurator]
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # TypeScript majors are upgraded deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # NestJS majors are upgraded together across the services by hand.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # bullmq 5 accepts only ioredis 5 clients; lift together with bullmq.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry stack moves in lockstep; majors are upgraded together by hand.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      # The 0.3xx experimental line pulls the 3.x stable packages; move to it in one PR.
      - dependency-name: "@opentelemetry/*"
        versions: [">=0.300.0 <1.0.0"]
      # 0.83.x pulls the 3.x / 0.301 line transitively; hold until that coordinated PR.
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: [">0.80.0"]
      # Keep Vinext pinned until newer versions pass the portal image regression.
      - dependency-name: "vinext"
        versions: [">1.0.0-beta.5"]
      # Update Storybook and its version-specific pnpm patch together by hand.
      - dependency-name: "storybook"
      # Keep the add-ons aligned with the locally patched Storybook release.
      - dependency-name: "@storybook/addon-a11y"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/addon-docs"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/react-vite"
        versions: [">10.6.2"]
      # The browser image and accessibility checks use these exact tool pins.
      - dependency-name: "@playwright/test"
        versions: [">1.62.1"]
      - dependency-name: "@axe-core/playwright"
        versions: [">4.12.1"]
      # React Flow 13 changes node change sets, color mode and CSS layers; upgrade with a browser check.
      - dependency-name: "@xyflow/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-version-updates:
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /infra/docker]
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Keycloak is upgraded by hand: its Dockerfile pins versioned CLI and library jars.
      - dependency-name: "keycloak/keycloak"
    groups:
      docker-version-updates:
        patterns: ['*']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /
    exclude-paths:
      - "tests/fixtures/dev-live-compose/**"
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Plan the Postgres major upgrade with pg_upgrade because 18 moves PGDATA to /var/lib/postgresql/18/docker and our volumes mount /var/lib/postgresql/data.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Upgrade Elasticsearch with Zammad because stored index data cannot be downgraded.
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Grafana's Jaeger data source still calls the v1 query API that Jaeger 2.21 removed (grafana-jaeger-datasource#87).
      - dependency-name: "jaegertracing/jaeger"
        versions: [">=2.21.0"]
      # Keep the same manual Keycloak upgrade hold as the Docker ecosystem.
      - dependency-name: "keycloak/keycloak"
      # Upgrade with the promtool pin in scripts/validate-infra.sh and the infra contract test.
      - dependency-name: "prom/prometheus"
      # Stage object-storage pins in the full Compose inventory before activation. See DELIVERY.md.
      - dependency-name: "minio/minio"
      - dependency-name: "minio/mc"
      # Refresh the provider contract in tests/fixtures/waha/installed-contract.json with each upgrade.
      - dependency-name: "devlikeapro/waha"
      # WasalX manages its own local and build image tags.
      - dependency-name: "wasalx/*"
    groups:
      docker-compose-version-updates:
        patterns: ['*']
