version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /services/workspace-configurator]
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # TypeScript majors are upgraded deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # NestJS majors are upgraded together across the services by hand.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # bullmq 5 accepts only ioredis 5 clients; lift together with bullmq.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry stack moves in lockstep; majors are upgraded together by hand.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      # The 0.3xx experimental line pulls the 3.x stable packages; move to it in one PR.
      - dependency-name: "@opentelemetry/*"
        versions: [">=0.300.0 <1.0.0"]
      # 0.83.x pulls the 3.x / 0.301 line transitively; hold until that coordinated PR.
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: [">0.80.0"]
      # Keep Vinext pinned until newer versions pass the portal image regression.
      - dependency-name: "vinext"
        versions: [">1.0.0-beta.5"]
      # Keep the add-ons aligned with the locally patched Storybook release.
      - dependency-name: "@storybook/addon-a11y"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/addon-docs"
        versions: [">10.6.2"]
      - dependency-name: "@storybook/react-vite"
        versions: [">10.6.2"]
      # The browser image and accessibility checks use these exact tool pins.
      - dependency-name: "@playwright/test"
        versions: [">1.62.1"]
      - dependency-name: "@axe-core/playwright"
        versions: [">4.12.1"]
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /infra/docker]
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ['*']
