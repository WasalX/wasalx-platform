version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /services/workspace-configurator, /.github/actions/setup-pnpm]
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /infra/docker]
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ['*']
