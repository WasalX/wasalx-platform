services:
  keycloak:
    # Only the disposable signed-main rehearsal can pair new Compose with a legacy image.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if [[ ! -s /opt/keycloak/providers/wasalx-mail-fence.jar ]]; then
          exec /opt/keycloak/bin/kc.sh start --import-realm
        fi
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
  # WasalX GHCR mirrors the exact full installer digests for hosted rehearsals.
  minio:
    image: ghcr.io/wasalx/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  minio-bootstrap:
    image: ghcr.io/wasalx/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
  grafana:
    # The installer's Compose --wait must also wait for Grafana's HTTP listener.
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 5s
      retries: 5
  public-webhook-preflight:
    # Exercise the same webhook probe against the installed API on the runner.
    environment:
      PUBLIC_WEBHOOK_BASE_URL: http://control-api:3001
    networks: !override [core]
