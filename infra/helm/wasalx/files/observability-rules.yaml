  groups:
    - name: wasalx-slo-recording
      interval: 30s
      rules:
        - record: wasalx:webhook_acceptance:ratio5m
          expr: sum(rate(wasalx_webhook_accepted_total[5m])) / clamp_min(sum(rate(wasalx_webhook_accepted_total[5m])) + sum(rate(wasalx_webhook_rejected_total[5m])), 0.000001)
        - record: wasalx:ticket_operation_success:ratio5m
          expr: sum(rate(wasalx_ticket_operation_total{result="succeeded"}[5m])) / clamp_min(sum(rate(wasalx_ticket_operation_total[5m])), 0.000001)
        - record: wasalx:provider_send_success:ratio5m
          expr: sum(rate(wasalx_provider_send_seconds_count{result="succeeded"}[5m])) / clamp_min(sum(rate(wasalx_provider_send_seconds_count[5m])), 0.000001)
        - record: wasalx:inbound_to_zammad:p95_seconds10m
          expr: histogram_quantile(0.95, sum by (le) (rate(wasalx_inbound_to_zammad_seconds_bucket[10m])))
        - record: wasalx:outbound_to_provider:p95_seconds10m
          expr: histogram_quantile(0.95, sum by (le) (rate(wasalx_outbound_to_provider_seconds_bucket[10m])))
    - name: wasalx-pilot-alerts
      rules:
        - alert: WasalXInboundQueueStalled
          expr: max(wasalx_inbox_queue_age_seconds) > 60
          for: 2m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: Inbound WhatsApp events have waited more than 60 seconds.
            runbook_url: "__RUNBOOK_BASE_URL__#inbound-queue-stalled"
        - alert: WasalXOutboundQueueStalled
          expr: max(wasalx_outbox_queue_age_seconds) > 60
          for: 2m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: Outbound WhatsApp deliveries have waited more than 60 seconds.
            runbook_url: "__RUNBOOK_BASE_URL__#outbound-queue-stalled"
        - alert: WasalXInboundLatencySLOBreach
          expr: wasalx:inbound_to_zammad:p95_seconds10m > 5
          for: 10m
          labels: { severity: critical, owner: connector }
          annotations:
            summary: Inbound acceptance-to-Zammad p95 is over five seconds.
            runbook_url: "__RUNBOOK_BASE_URL__#inbound-latency"
        - alert: WasalXOutboundLatencySLOBreach
          expr: wasalx:outbound_to_provider:p95_seconds10m > 5
          for: 10m
          labels: { severity: critical, owner: connector }
          annotations:
            summary: Zammad delivery request-to-provider p95 is over five seconds.
            runbook_url: "__RUNBOOK_BASE_URL__#outbound-latency"
        - alert: WasalXZammadOperationErrorRateHigh
          expr: sum(rate(wasalx_ticket_operation_total{result!="succeeded"}[5m])) / clamp_min(sum(rate(wasalx_ticket_operation_total[5m])), 0.000001) > 0.05
          for: 5m
          labels: { severity: critical, owner: connector }
          annotations:
            summary: More than 5% of Zammad operations are failing.
            runbook_url: "__RUNBOOK_BASE_URL__#zammad-errors"
        - alert: WasalXProviderSendErrorRateHigh
          expr: sum(rate(wasalx_provider_send_seconds_count{result!="succeeded"}[5m])) / clamp_min(sum(rate(wasalx_provider_send_seconds_count[5m])), 0.000001) > 0.05
          for: 5m
          labels: { severity: critical, owner: connector }
          annotations:
            summary: More than 5% of provider send attempts are failing or unknown.
            runbook_url: "__RUNBOOK_BASE_URL__#provider-send-errors"
        - alert: WasalXConnectorWorkerMissing
          expr: absent(wasalx_worker_heartbeat{component="connector_worker"}) == 1 or max(wasalx_worker_heartbeat{component="connector_worker"}) < 1
          for: 2m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: No ready connector worker has emitted a heartbeat.
            runbook_url: "__RUNBOOK_BASE_URL__#worker-or-session-loss"
        - alert: WasalXWahaWorkerTelemetryMissing
          expr: absent(wasalx_waha_worker_health) == 1
          for: 2m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: No WAHA registry worker health signal is reaching the metrics backend.
            runbook_url: "__RUNBOOK_BASE_URL__#waha-worker-telemetry-missing"
        - alert: WasalXWahaWorkerUnhealthy
          expr: min by (worker, engine) (wasalx_waha_worker_health) < 1
          for: 1m
          labels: { severity: critical, owner: connector }
          annotations:
            summary: A WAHA worker is unhealthy or its health probe cannot complete.
            runbook_url: "__RUNBOOK_BASE_URL__#waha-worker-unhealthy"
        - alert: WasalXWahaWorkerCapacityHigh
          expr: max by (worker, engine) (wasalx_waha_worker_sessions) / clamp_min(max by (worker, engine) (wasalx_waha_worker_capacity), 1) >= 0.9
          for: 5m
          labels: { severity: warning, owner: platform }
          annotations:
            summary: A WAHA worker has consumed at least 90% of its configured session capacity.
            runbook_url: "__RUNBOOK_BASE_URL__#waha-worker-capacity-high"
        - alert: WasalXConnectionActionRequired
          expr: sum(wasalx_connection_state{state="action_required"}) > 0
          for: 1m
          labels: { severity: warning, owner: operations }
          annotations:
            summary: One or more WhatsApp connections require administrator action.
            runbook_url: "__RUNBOOK_BASE_URL__#connection-action-required"
        - alert: WasalXDuplicateSuppressionSpike
          expr: sum(rate(wasalx_webhook_duplicates_total[10m])) > 0.1
          for: 10m
          labels: { severity: warning, owner: connector }
          annotations:
            summary: Duplicate provider events are arriving at an unusual rate.
            runbook_url: "__RUNBOOK_BASE_URL__#duplicate-spike"
        - alert: WasalXTerminalDeliveryFailure
          expr: sum(increase(wasalx_delivery_terminal_failure_total[5m])) > 0
          for: 1m
          labels: { severity: warning, owner: operations }
          annotations:
            summary: At least one delivery became terminally failed.
            runbook_url: "__RUNBOOK_BASE_URL__#terminal-delivery-failure"
        - alert: WasalXUnknownProviderOutcome
          expr: sum(increase(wasalx_delivery_outcome_unknown_total[5m])) > 0
          for: 1m
          labels: { severity: critical, owner: operations }
          annotations:
            summary: A provider send outcome is unknown and must be reconciled.
            runbook_url: "__RUNBOOK_BASE_URL__#unknown-provider-outcome"
        - alert: WasalXAuthorizationAnomaly
          expr: sum(rate(wasalx_tenant_authorization_denied_total[5m])) > 0.01
          for: 5m
          labels: { severity: critical, owner: security }
          annotations:
            summary: Tenant or service authorization anomalies are sustained.
            runbook_url: "__RUNBOOK_BASE_URL__#authorization-anomaly"
        - alert: WasalXProvisioningTerminalFailure
          expr: sum(increase(wasalx_provisioning_operations_total{result="terminal_failure"}[15m])) > 0
          for: 1m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: A tenant provisioning operation failed terminally.
            runbook_url: "__RUNBOOK_BASE_URL__#provisioning-failure"
        - alert: WasalXPrivacyTerminalFailure
          expr: sum(increase(wasalx_privacy_job_total{result="failed_terminal"}[15m])) > 0
          for: 1m
          labels: { severity: critical, owner: privacy }
          annotations:
            summary: A privacy or retention job failed terminally.
            runbook_url: "__RUNBOOK_BASE_URL__#privacy-failure"
        - alert: WasalXPrivacyFailurePersistenceFailed
          expr: sum(increase(wasalx_privacy_job_total{result="persistence_failed"}[15m])) > 0
          for: 1m
          labels: { severity: critical, owner: privacy }
          annotations:
            summary: A privacy or retention job failure could not be saved.
            runbook_url: "__RUNBOOK_BASE_URL__#privacy-failure-persistence"
        - alert: WasalXDatabasePoolSaturated
          expr: max(wasalx_database_pool_connections{state="waiting"}) > 0
          for: 5m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: Database callers are waiting for a pool connection.
            runbook_url: "__RUNBOOK_BASE_URL__#database-saturation"
        - alert: WasalXSearchClusterRed
          expr: elasticsearch_cluster_health{status="red"} > 0 or wasalx_search_cluster_red > 0
          for: 2m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: The Zammad search cluster is red.
            runbook_url: "__RUNBOOK_BASE_URL__#search-saturation"
        - alert: WasalXObjectStorageLow
          # The assisted alpha monitors its actual shared guest/PVC filesystem.
          expr: minio_cluster_health_capacity_usable_free_bytes / clamp_min(minio_cluster_health_capacity_usable_total_bytes, 1) < 0.15 or wasalx_production_disk_free_ratio < 0.15
          for: 10m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: Object-storage or its production filesystem has less than 15% usable free capacity.
            runbook_url: "__RUNBOOK_BASE_URL__#object-storage-saturation"
        - alert: WasalXCollectorExportFailure
          expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0 or sum(rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
          for: 5m
          labels: { severity: critical, owner: platform }
          annotations:
            summary: OpenTelemetry Collector exports are failing.
            runbook_url: "__RUNBOOK_BASE_URL__#collector-export-failure"
