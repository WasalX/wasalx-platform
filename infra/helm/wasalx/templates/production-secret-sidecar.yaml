{{- if .Values.productionSecretSidecar.enabled }}
{{- $cfg := .Values.productionSecretSidecar }}
{{- if ne .Values.secretSidecarUrl (printf "https://secrets-agent.%s.svc.cluster.local:8443" .Release.Namespace) }}
{{- fail "production secret adapter requires its matching private secretSidecarUrl" }}
{{- end }}
{{- if ne .Values.environment "production" }}
{{- fail "production secret adapter requires production environment" }}
{{- end }}
{{- if eq $cfg.storeNamespace .Release.Namespace }}
{{- fail "production secret store must use a separate namespace" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$" $cfg.image) }}
{{- fail "production secret adapter requires an immutable image digest" }}
{{- end }}
{{- if not $cfg.apiServerCidrs }}{{ fail "production secret adapter requires explicit API server CIDRs" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: wasalx-secret-adapter }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: wasalx-secret-adapter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wasalx-secret-adapter, app.kubernetes.io/part-of: wasalx }
    spec:
      serviceAccountName: wasalx-secret-adapter
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: secret-adapter
          image: {{ $cfg.image | quote }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports: [{ name: https, containerPort: 8443 }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          readinessProbe:
            httpGet: { scheme: HTTPS, path: /health, port: https }
            timeoutSeconds: 5
            periodSeconds: 10
          env:
            - { name: SECRET_NAMESPACE, value: {{ required "production secret adapter requires storeNamespace" $cfg.storeNamespace | quote }} }
            - { name: SECRET_READ_TOKEN_FILE, value: /credentials/read-token }
            - { name: SECRET_WRITE_TOKEN_FILE, value: /credentials/write-token }
            - { name: SECRET_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: SECRET_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: KUBERNETES_API_URL, value: "https://kubernetes.default.svc" }
            - { name: KUBERNETES_CA_FILE, value: /kubernetes/ca.crt }
            - { name: KUBERNETES_TOKEN_FILE, value: /kubernetes/token }
          volumeMounts:
            - { name: credentials, mountPath: /credentials, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: kubernetes, mountPath: /kubernetes, readOnly: true }
      volumes:
        - name: credentials
          secret:
            secretName: {{ required "production secret adapter requires credentialsSecretName" $cfg.credentialsSecretName | quote }}
            defaultMode: 0440
            items: [{ key: SECRET_SIDECAR_TOKEN, path: read-token }, { key: SECRET_SIDECAR_WRITE_TOKEN, path: write-token }]
        - name: tls
          secret:
            secretName: {{ required "production secret adapter requires tlsSecretName" $cfg.tlsSecretName | quote }}
            defaultMode: 0440
        - name: kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
---
apiVersion: v1
kind: Service
metadata: { name: secrets-agent }
spec:
  selector: { app.kubernetes.io/name: wasalx-secret-adapter }
  ports: [{ name: https, port: 8443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wasalx-secret-adapter }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: wasalx-secret-adapter } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [wasalx-api, wasalx-worker, wasalx-invitation-mailer] }
      ports: [{ protocol: TCP, port: 8443 }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        {{- range $cfg.apiServerCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 6443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wasalx-secret-adapter-clients }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [wasalx-api, wasalx-worker, wasalx-invitation-mailer] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: wasalx-secret-adapter } }
      ports: [{ protocol: TCP, port: 8443 }]
{{- end }}
