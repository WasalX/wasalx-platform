global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: local-full

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: wasalx-application-telemetry
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: wasalx-otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: wasalx-jaeger
    static_configs:
      - targets: [jaeger:8888]

  - job_name: wasalx-minio
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: [minio:9000]

  - job_name: wasalx-keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
