extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318
  redis:
    endpoint: redis:6379
    collection_interval: 15s
  elasticsearch:
    endpoint: http://zammad-elasticsearch:9200
    collection_interval: 30s
    nodes: ["_local"]
    indices: []

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/sanitize:
    attributes:
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: host.name, action: delete }
      - { key: elasticsearch.cluster.name, action: delete }
      - { key: elasticsearch.index.name, action: delete }
      - { key: elasticsearch.node.name, action: delete }
  attributes/sanitize:
    actions:
      - { key: url.full, action: delete }
      - { key: url.path, action: delete }
      - { key: url.query, action: delete }
      - { key: http.url, action: delete }
      - { key: http.target, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: db.query.text, action: delete }
      - { key: db.statement, action: delete }
      - { key: graphql.document, action: delete }
      - { key: messaging.message.body, action: delete }
  transform/prometheus_identity:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service_name"], resource.attributes["service.name"])
          - set(attributes["service_instance_id"], resource.attributes["service.instance.id"])
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    metric_expiration: 5m
    enable_open_metrics: true
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_to_telemetry_conversion:
      enabled: false
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [health_check, pprof]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, batch]
      exporters: [otlp_http/jaeger]
    metrics:
      receivers: [otlp, redis, elasticsearch]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, transform/prometheus_identity, batch]
      exporters: [prometheus]
