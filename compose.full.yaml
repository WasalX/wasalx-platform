      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tenant-zammad]
    restart: unless-stopped

  zammad-memcached:
    profiles: [full]
    image: memcached:1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
    command: [memcached, -m, 256M]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "11211"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tenant-zammad]
    restart: unless-stopped

  zammad-elasticsearch:
    profiles: [full]
    image: elasticsearch:9.5.5@sha256:6f11b295d5099c18b8774d280a82725d1184d0d5cb08373b12785ce7cd7a9bfb
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      xpack.profiling.enabled: "false"
      # The local full profile shares one Docker Desktop VM with ClamAV and
      # WAHA. Zammad does not use Elasticsearch ML, Watcher, or Universal
      # Profiling; disabling them and using a 384 MiB heap reduces pressure in
      # the disposable local profile.
      # Production search sizing and feature policy are managed separately.
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    volumes: [zammad-elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20
    networks: [tenant-zammad]
    restart: unless-stopped

  zammad-init:
    <<: *full-zammad-service
    command: [zammad-init]
    user: 0:0
    restart: on-failure
    depends_on:
      zammad-postgresql: { condition: service_healthy }
      zammad-redis: { condition: service_healthy }
      zammad-memcached: { condition: service_healthy }
      zammad-elasticsearch: { condition: service_healthy }

  zammad-package:
    <<: *full-zammad-service
    command: [wasalx-package-install]
    restart: "no"
    depends_on:
      zammad-init: { condition: service_completed_successfully }

  zammad-runtime-bootstrap:
    <<: *full-zammad-service
    command: [bash, /usr/local/bin/wasalx-runtime-bootstrap]
    environment:
      <<: *full-zammad-environment
      WASALX_ZAMMAD_BOOTSTRAP_EMAIL: ${WASALX_FULL_ZAMMAD_BOOTSTRAP_EMAIL:-fixture-0003@example.test}
      WASALX_ZAMMAD_BOOTSTRAP_NAME: Qualification Administrator
      WASALX_SERVICE_IDENTITY_MODE: ${WASALX_SERVICE_IDENTITY_MODE:-}
      WASALX_ZAMMAD_BOOTSTRAP_PASSWORD: ${WASALX_FULL_ZAMMAD_BOOTSTRAP_ADMIN_PASSWORD:?Set WASALX_FULL_ZAMMAD_BOOTSTRAP_ADMIN_PASSWORD}
      WASALX_ZAMMAD_BOOTSTRAP_PREVIOUS_EMAIL: ${WASALX_FULL_ZAMMAD_BOOTSTRAP_PREVIOUS_EMAIL:-fixture-0004@example.test}
      WASALX_ZAMMAD_AGENT_EMAIL: ${WASALX_FULL_ZAMMAD_AGENT_EMAIL:-fixture-0005@example.test}
      WASALX_ZAMMAD_AGENT_NAME: Qualification Agent
      WASALX_ZAMMAD_AGENT_PASSWORD: ${WASALX_FULL_ZAMMAD_AGENT_PASSWORD:?Set WASALX_FULL_ZAMMAD_AGENT_PASSWORD}
      ZAMMAD_SERVICE_TOKEN: ${WASALX_FULL_ZAMMAD_API_TOKEN:?Set WASALX_FULL_ZAMMAD_API_TOKEN}
      ZAMMAD_PRIVACY_TOKEN: ${WASALX_FULL_ZAMMAD_PRIVACY_TOKEN:?Set WASALX_FULL_ZAMMAD_PRIVACY_TOKEN}
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
      - ./infra/docker/full/zammad/bootstrap-runtime.sh:/usr/local/bin/wasalx-runtime-bootstrap:ro
      - ./infra/docker/full/zammad/bootstrap-runtime.rb:/usr/local/lib/wasalx/bootstrap-runtime.rb:ro
    restart: "no"
    depends_on:
      zammad-package: { condition: service_completed_successfully }

  zammad-backup:
    <<: *full-zammad-service
    command: [zammad-backup]
    user: 0:0
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-package: { condition: service_completed_successfully }

  zammad-railsserver:
    <<: *full-zammad-service
    command: [zammad-railsserver]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    depends_on:
      zammad-runtime-bootstrap: { condition: service_completed_successfully }

  zammad-scheduler:
    <<: *full-zammad-service
    command: [zammad-scheduler]
    depends_on:
      zammad-runtime-bootstrap: { condition: service_completed_successfully }

  zammad-websocket:
    <<: *full-zammad-service
    command: [zammad-websocket]
    depends_on:
      zammad-runtime-bootstrap: { condition: service_completed_successfully }

  zammad-nginx:
    <<: *full-zammad-service
    command: [zammad-nginx]
    init: false
    ports: ["127.0.0.1:${ZAMMAD_PORT:-8081}:8080"]
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
      - ./infra/docker/full/zammad/nginx-modern-entry.conf:/opt/zammad/contrib/nginx/zammad.conf:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/v1/wasalx/health]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 12
    depends_on:
      zammad-railsserver: { condition: service_healthy }
    networks: !override [edge, tenant-zammad]

  # The local seed deliberately creates the instance as PROVISIONING. Promote
  # it only after the exact package installer exited zero and nginx proves that
  # the initialized Zammad runtime is serving. Production provisioning uses the
  # fenced evidence path in migration 0034 instead of this local-only job.
  zammad-activation:
    profiles: [full]
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: wasalx
      PGUSER: wasalx
      PGPASSWORD: ${WASALX_ADMIN_PASSWORD:?Set WASALX_ADMIN_PASSWORD}
    command: [psql, --set=ON_ERROR_STOP=1, --file=/bootstrap/activate-zammad.sql]
    volumes:
      - ./infra/docker/full/postgres/activate-zammad.sql:/bootstrap/activate-zammad.sql:ro
    depends_on:
      full-qualification-seed: { condition: service_completed_successfully }
      zammad-package: { condition: service_completed_successfully }
      zammad-runtime-bootstrap: { condition: service_completed_successfully }
      zammad-nginx: { condition: service_healthy }
    networks: [core]
    restart: "no"

  otel-collector:
    profiles: [full]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./infra/docker/full/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: [CMD, /otelcol-contrib, --version]
      interval: 30s
      # The distroless collector has no HTTP client for its health_check
      # extension. Starting a second collector binary for this exec probe can
      # be slow under Rosetta or during ClamAV/Elasticsearch cold starts, so
      # keep the timeout above the observed contention window.
      timeout: 30s
      start_period: 90s
      retries: 5
    depends_on:
      jaeger: { condition: service_started }
      redis: { condition: service_healthy }
      zammad-elasticsearch: { condition: service_healthy }
    networks: [core, tenant-zammad, observability]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  jaeger:
    profiles: [full]
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]
    networks: [observability]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  alertmanager:
    profiles: [full]
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./infra/docker/full/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    networks: [observability]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  prometheus:
    profiles: [full]
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/docker/full/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./infra/docker/full/prometheus/alerts.yaml:/etc/prometheus/rules/alerts.yaml:ro
      - ./infra/docker/full/prometheus/recording-rules.yaml:/etc/prometheus/rules/recording-rules.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      otel-collector: { condition: service_started }
      alertmanager: { condition: service_started }
      minio: { condition: service_healthy }
    networks: [edge, storage, observability]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    profiles: [full]
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_USER: ${WASALX_FULL_GRAFANA_ADMIN_USER:-wasalx-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WASALX_FULL_GRAFANA_ADMIN_PASSWORD:?Set WASALX_FULL_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/docker/full/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/full/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3002}:3000"]
    depends_on:
      prometheus: { condition: service_started }
      jaeger: { condition: service_started }
    networks: [observability]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Optional real Kubernetes-backed driver. It is deliberately outside the
  # `full` profile because the local dependency stack is not a Kubernetes
  # workspace controller. Without an API URL, projected token mount, real
  # reconciler, and package digest this container exits or remains unready.
  workspace-configurator-image-contract:
    profiles: [tenant-provisioning-artifacts]
    build:
      context: .
      dockerfile: Dockerfile.workspace-configurator
    image: wasalx/workspace-configurator:local
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        test "$$(id -u)" = 1000;
        test "$$(id -g)" = 1000;
        node --version;
        pg_dump --version;
        printf '%s  %s\n'
        '9673aefce89b6aa4d767eed01ae574d48397de28de5ff6f4c65d86ceee6ee761'
        '/app/artifacts/wasalx-0.5.84.zpm' | sha256sum --check --strict

    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  tenant-provisioner:
    profiles: [tenant-provisioning]
    build:
      context: .
      dockerfile: Dockerfile.tenant-provisioner
    image: wasalx/tenant-provisioner:local
    environment:
      NODE_ENV: development
      PORT: "8090"
      PROVISIONING_DRIVER_JWT_SECRET: ${WASALX_PROVISIONING_DRIVER_JWT_SECRET:-}
      KUBERNETES_API_URL: ${WASALX_PROVISIONER_KUBERNETES_API_URL:-https://kubernetes.default.svc}
      KUBERNETES_BEARER_TOKEN_FILE: /var/run/secrets/wasalx-kubernetes/token
      NODE_EXTRA_CA_CERTS: /var/run/secrets/wasalx-kubernetes/ca.crt
      PROVISIONING_WORKSPACE_NAMESPACE: ${WASALX_PROVISIONER_WORKSPACE_NAMESPACE:-wasalx-tenants}
      PROVISIONING_RECONCILER_IDENTITY: ${WASALX_PROVISIONER_RECONCILER_IDENTITY:-wasalx-workspace-controller/v1}
      PROVISIONING_WORKSPACE_BASE_DOMAIN: ${WASALX_PROVISIONER_BASE_DOMAIN:-support.localhost}
      PROVISIONING_OIDC_ISSUER: ${WASALX_PROVISIONER_OIDC_ISSUER:-https://identity.local/realms/wasalx}
      ALLOW_INSECURE_KUBERNETES_API: ${WASALX_PROVISIONER_ALLOW_INSECURE_KUBERNETES_API:-false}
      OTEL_SERVICE_NAME: wasalx-tenant-provisioner
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1"
      WASALX_ENVIRONMENT: local-full
    volumes:
      - type: bind
        source: ${WASALX_PROVISIONER_TOKEN_FILE:-./infra/docker/full/provisioner/unconfigured-token}
        target: /var/run/secrets/wasalx-kubernetes/token
        read_only: true
      - type: bind
        source: ${WASALX_PROVISIONER_CA_FILE:-./infra/docker/full/provisioner/unconfigured-ca.crt}
        target: /var/run/secrets/wasalx-kubernetes/ca.crt
        read_only: true
    networks: [core, observability, provisioning-egress]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  # Optional real controller. The placeholders make this fail closed until a
  # private Kubernetes API, production provider gateway, and External Secrets
  # store are supplied. Release images arrive only through the signed CR.
  tenant-workspace-controller:
    profiles: [tenant-provisioning]
    build:
      context: .
      dockerfile: Dockerfile.tenant-workspace-controller
    image: wasalx/tenant-workspace-controller:local
    environment:
      NODE_ENV: development
      PORT: "8091"
      KUBERNETES_API_URL: ${WASALX_PROVISIONER_KUBERNETES_API_URL:-https://kubernetes.default.svc}
      KUBERNETES_BEARER_TOKEN_FILE: /var/run/secrets/wasalx-kubernetes/token
      NODE_EXTRA_CA_CERTS: /var/run/secrets/wasalx-kubernetes/ca.crt
      PROVISIONING_WORKSPACE_NAMESPACE: ${WASALX_PROVISIONER_WORKSPACE_NAMESPACE:-wasalx-tenants}
      PROVISIONING_RECONCILER_IDENTITY: ${WASALX_PROVISIONER_RECONCILER_IDENTITY:-wasalx-workspace-controller/v1}
      CONTROLLER_INSTANCE_ID: ${WASALX_CONTROLLER_INSTANCE_ID:-compose-controller-1}
      CONTROLLER_LEASE_DURATION_SECONDS: ${WASALX_CONTROLLER_LEASE_DURATION_SECONDS:-120}
      WORKSPACE_PROVIDER_URL: ${WASALX_WORKSPACE_PROVIDER_URL:-https://workspace-provider.platform.svc.cluster.local}
      WASALX_CONTROL_URL: ${WASALX_WORKSPACE_CONTROL_URL:-http://control-api:3001}
      ALLOW_INSECURE_WASALX_CONTROL_URL: "true"
      WASALX_PORTAL_URL: ${WASALX_WORKSPACE_PORTAL_URL:-http://127.0.0.1:3000}
      ALLOW_INSECURE_WASALX_PORTAL_URL: "true"
      WORKSPACE_PROVIDER_TOKEN_FILE: /var/run/secrets/wasalx-provider/token
      EXTERNAL_SECRET_STORE_NAME: ${WASALX_EXTERNAL_SECRET_STORE_NAME:-wasalx-tenant-secrets}
      EXTERNAL_SECRET_STORE_KIND: ${WASALX_EXTERNAL_SECRET_STORE_KIND:-ClusterSecretStore}
      PROVISIONING_WORKSPACE_BASE_DOMAIN: ${WASALX_PROVISIONER_BASE_DOMAIN:-support.localhost}
      ZAMMAD_INGRESS_CLASS_NAME: ${WASALX_ZAMMAD_INGRESS_CLASS_NAME:-nginx}
      ZAMMAD_INGRESS_NAMESPACE: ${WASALX_ZAMMAD_INGRESS_NAMESPACE:-ingress-nginx}
      ZAMMAD_CLUSTER_ISSUER: ${WASALX_ZAMMAD_CLUSTER_ISSUER:-local-development}
      ZAMMAD_STORAGE_CLASS_NAME: ${WASALX_ZAMMAD_STORAGE_CLASS_NAME:-standard}
      ZAMMAD_ALLOWED_EGRESS_JSON: ${WASALX_ZAMMAD_ALLOWED_EGRESS_JSON:-[]}
      OTEL_SERVICE_NAME: wasalx-tenant-workspace-controller
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - type: bind
        source: ${WASALX_PROVISIONER_TOKEN_FILE:-./infra/docker/full/provisioner/unconfigured-token}
        target: /var/run/secrets/wasalx-kubernetes/token
        read_only: true
      - type: bind
        source: ${WASALX_PROVISIONER_CA_FILE:-./infra/docker/full/provisioner/unconfigured-ca.crt}
        target: /var/run/secrets/wasalx-kubernetes/ca.crt
        read_only: true
      - type: bind
        source: ${WASALX_WORKSPACE_PROVIDER_TOKEN_FILE:-./infra/docker/full/provisioner/unconfigured-provider-token}
        target: /var/run/secrets/wasalx-provider/token
        read_only: true
    networks: [observability, provisioning-egress]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

networks:
  edge: {}
  core: { internal: true }
  identity-db: { internal: true }
  connectors: { internal: true }
  storage: { internal: true }
  tenant-zammad: { internal: true }
  observability: { internal: true }
  connector-egress: {}
  invitation-egress: {}
  security-egress: {}
  tenant-egress: {}
  provisioning-egress: {}
  identity-runtime: { internal: true }

volumes:
  keycloak-postgresql-data: {}
  minio-data: {}
  clamav-db: {}
  waha-gows-sessions: {}
  waha-noweb-sessions: {}
  zammad-postgresql-data: {}
  zammad-redis-data: {}
  zammad-elasticsearch-data: {}
  zammad-storage: {}
  zammad-backup: {}
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
