packages:
  - "services/*"
  - "packages/observability"
  - "packages/core"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  msgpackr-extract: true
  # OTel's protobuf serializer is pure JavaScript at runtime. Keep third-party
  # lifecycle scripts disabled; this value also makes pnpm's policy explicit.
  protobufjs: false

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  storybook@10.6.2: patches/storybook@10.6.2.patch

overrides:
  'vinext>image-size': 2.0.3
  source-map-js@1.2.1: 1.2.2
  '@grpc/grpc-js@1.14.4': 1.14.5
  '@opentelemetry/core@2.10.0': 2.12.1
  '@opentelemetry/core@2.11.0': 2.12.1
  '@opentelemetry/resources@2.10.0': 2.12.1
  '@opentelemetry/resources@2.11.0': 2.12.1
  '@opentelemetry/sdk-metrics@2.11.0': 2.12.1
  '@opentelemetry/sdk-trace-base@2.11.0': 2.12.1
  undici@7.29.0: 7.30.1
  # Nest pins Fastify separately; both callers must use the patched release.
  fastify: 5.12.8
  'fast-uri@3': 3.1.9
  'fast-uri@4': 4.2.3
  'satori@0.16.0': 0.33.5
  'fflate@0.7': 0.7.5
  'gcp-metadata@8.1.4>gaxios@7.1.3': 7.1.4
  '@storybook/react-vite@10.6.2>@joshwooding/vite-plugin-react-docgen-typescript@0.7.0': 0.9.1
  # The legacy Drizzle loader uses esbuild only for transform/build, not serve.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  find-my-way: 9.7.0
  js-yaml: 4.3.2
  sharp: 0.35.5
  zod@4.4.3: 4.6.6
  systeminformation: 5.33.16
